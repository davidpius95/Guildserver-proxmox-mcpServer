# GENERATED by scripts/nodes.py -- edit proxmox-config/nodes.json instead.
# One MCP process can route pve_call to multiple Proxmox clusters.

x-node-common: &node-common
  build: .
  image: proxmox-mcp-plus:latest
  env_file:
    - ./.env
  volumes:
    - ./proxmox-config:/app/proxmox-config:ro
    # Node SSH key backing execute_container_command's `pct exec` path.
    - "${PROXMOX_MCP_SSH_KEY:-$HOME/.ssh/proxmox_guild_a}:/app/ssh/id_node:ro"
  restart: unless-stopped
  networks:
    - proxmox-network

services:
  guild-a:
    <<: *node-common
    container_name: proxmox-mcp-guild-a
    # multi-cluster MCP -> http://localhost:8811
    ports:
      - "${PROXMOX_MCP_BIND_HOST:-0.0.0.0}:8811:8811"
    environment:
      - PROXMOX_MCP_CONFIG=/app/proxmox-config/config.guild-a.json
      - API_HOST=0.0.0.0
      - API_PORT=8811
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8811/openapi.json"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  proxmox-network:
    driver: bridge
