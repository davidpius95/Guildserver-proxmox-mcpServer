# GENERATED by scripts/nodes.py -- edit proxmox-config/nodes.json instead.
# Each node is a standalone Proxmox host, so it gets its own instance:
# the config schema holds exactly one host + one token.

x-node-common: &node-common
  build: .
  image: proxmox-mcp-plus:latest
  volumes:
    - ./proxmox-config:/app/proxmox-config:ro
  restart: unless-stopped
  networks:
    - proxmox-network

services:
  guild-a:
    <<: *node-common
    container_name: proxmox-mcp-guild-a
    # 192.168.8.125 -> http://localhost:8811
    ports:
      - "8811:8811"
    environment:
      - PROXMOX_MCP_CONFIG=/app/proxmox-config/config.guild-a.json
      - API_HOST=0.0.0.0
      - API_PORT=8811
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8811/openapi.json"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  proxmox-network:
    driver: bridge
